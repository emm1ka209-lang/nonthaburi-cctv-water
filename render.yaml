services:
  - type: web
    name: nonthaburi-cctv-water
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: ADMIN_TOKEN      # ตั้งค่าใน Render dashboard (ไม่ใส่ในโค้ด)
        sync: false
      - key: SNAPSHOT_TTL
        value: "10"
