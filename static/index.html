<style>

/* =====================================================
   ROOT
===================================================== */

:root {

  --purple:
    #5b35b5;

  --purple-dark:
    #45218f;

  --purple-light:
    #eee9ff;

  --purple-soft:
    #f7f4ff;

  --yellow:
    #e6b629;

  --text:
    #29263b;

  --muted:
    #777487;

  --border:
    #e8e3f3;

  --bg:
    #f7f7fb;

  --white:
    #ffffff;

  --green:
    #19a957;

  --red:
    #df4b4b;

  --shadow:
    0 8px 25px rgba(55,40,100,.07);
}


/* =====================================================
   RESET
===================================================== */

* {

  box-sizing:
    border-box;

}


html,
body {

  margin:
    0;

  padding:
    0;

  min-height:
    100%;

  font-family:
    "Noto Sans Thai",
    system-ui,
    sans-serif;

  color:
    var(--text);

  background:
    linear-gradient(
      135deg,
      #fafaff 0%,
      #ffffff 50%,
      #f5f1ff 100%
    );

}


/* =====================================================
   SPLASH
===================================================== */

.splash {

  position:
    fixed;

  inset:
    0;

  z-index:
    9999;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #f4f0ff
    );

  transition:
    opacity .45s ease,
    visibility .45s ease;

}


.splash.hide {

  opacity:
    0;

  visibility:
    hidden;

}


.splash-inner {

  width:
    min(90vw,560px);

  padding:
    30px;

  text-align:
    center;

}


.splash-logo {

  width:
    95px;

  height:
    95px;

  object-fit:
    contain;

  display:
    block;

  margin:
    0 auto 18px;

}


.splash-title {

  font-size:
    clamp(19px,3vw,26px);

  line-height:
    1.5;

  font-weight:
    800;

}


.splash-subtitle {

  margin-top:
    5px;

  color:
    var(--muted);

  font-size:
    14px;

}


/* =====================================================
   HEADER
   เตี้ยกว่าเดิมมาก
===================================================== */

.header {

  height:
    72px;

  padding:
    0 24px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    20px;

  background:
    rgba(255,255,255,.96);

  border-bottom:
    1px solid var(--border);

  box-shadow:
    0 2px 12px rgba(50,40,90,.04);

}


/* =====================================================
   HEADER TITLE
===================================================== */

.header-left {

  min-width:
    0;

  display:
    flex;

  align-items:
    center;

}


.header-title {

  font-size:
    clamp(15px,1.45vw,21px);

  line-height:
    1.25;

  font-weight:
    800;

  white-space:
    nowrap;

  overflow:
    hidden;

  text-overflow:
    ellipsis;

}


.header-subtitle {

  display:
    inline;

  margin-left:
    10px;

  color:
    var(--muted);

  font-size:
    12px;

  font-weight:
    500;

}


.header-subtitle::before {

  content:
    "•";

  margin-right:
    10px;

  color:
    var(--purple);

}


/* =====================================================
   HEADER RIGHT
===================================================== */

.header-right {

  flex-shrink:
    0;

  display:
    flex;

  align-items:
    center;

  gap:
    18px;

}


.update-box {

  display:
    flex;

  align-items:
    center;

  gap:
    7px;

  font-size:
    12px;

  white-space:
    nowrap;

}


.update-label {

  color:
    var(--muted);

}


.update-value {

  font-weight:
    700;

}


.status-online {

  display:
    flex;

  align-items:
    center;

  gap:
    6px;

  color:
    var(--green);

  font-size:
    12px;

  font-weight:
    700;

  white-space:
    nowrap;

}


.status-dot {

  width:
    8px;

  height:
    8px;

  border-radius:

  background:

.page {

   MAIN LAYOUT
===================================================== */

.main-layout {

  display:

  gap:
    14px;

  align-items:
    start;

}


/* =====================================================
   CAMERA PANEL
===================================================== */

.camera-panel {

  background:
    rgba(255,255,255,.94);

  border:
    1px solid var(--border);

  border-radius:
    15px;

  padding:
    14px;

  box-shadow:
    var(--shadow);

}


.section-title {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  font-size:
    17px;

  font-weight:
    800;

  margin-bottom:
    11px;

}


.section-icon {

  width:
    32px;

  height:
    32px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  border-radius:
    9px;

  background:
    var(--purple-light);

  color:
    var(--purple);

}


/* =====================================================
   CAMERA LIST
===================================================== */

.camera-list {

  display:
    flex;

  flex-direction:
    column;

  gap:
    10px;

}


.camera-card {

  display:
    grid;

  grid-template-columns:
    105px minmax(0,1fr);

  gap:
    10px;

  padding:
    8px;

  background:
    #fff;

  border:
    1px solid var(--border);

  border-radius:
    12px;

  cursor:
    pointer;

  transition:
    .2s ease;

}


.camera-card:hover {

  border-color:
    #bca9ef;

  box-shadow:
    0 5px 16px rgba(91,53,181,.09);

}


.camera-card.active {

  border-color:
    #8e72d7;

  box-shadow:
    0 0 0 2px
    rgba(91,53,181,.07);

}


.camera-card.disabled {

  cursor:
    default;

  background:
    #f8f8f9;

}


/* =====================================================
   CAMERA THUMBNAIL
===================================================== */

.camera-thumb {

  position:
    relative;

  width:
    100%;

  aspect-ratio:
    16 / 10;

  overflow:
    hidden;

  border-radius:
    8px;

  background:
    linear-gradient(
      135deg,
      #f0edff,
      #ddd7f4
    );

}


.camera-thumb img {

  width:
    100%;

  height:
    100%;

  display:
    block;

  object-fit:
    cover;

}


.camera-placeholder {

  position:
    absolute;

  inset:
    0;

  display:
    flex;

  flex-direction:
    column;

  align-items:
    center;

  justify-content:
    center;

  color:
    var(--purple);

  font-size:
    11px;

  font-weight:
    700;

}


.camera-placeholder-icon {

  font-size:
    25px;

  opacity:
    .6;

}


.camera-thumb:has(img[src])
.camera-placeholder {

  display:
    none;

}


.camera-thumb.no-image
.camera-placeholder {

  display:
    flex;

}


.camera-thumb-overlay {

  position:
    absolute;

  inset:
    0;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  text-align:
    center;

  color:
    #fff;

  background:
    rgba(40,35,60,.6);

  font-size:
    11px;

  font-weight:
    700;

}


/* =====================================================
   CAMERA CONTENT
===================================================== */

.camera-content {

  min-width:
    0;

  display:
    flex;

  flex-direction:
    column;

  justify-content:
    center;

}


.camera-name {

  font-size:
    14px;

  line-height:
    1.4;

  font-weight:
    800;

}


.camera-location {

  margin-top:
    3px;

  font-size:
    11px;

  color:
    var(--muted);

}


.camera-id {

  margin-top:
    2px;

  font-size:
    10px;

  color:
    #999;

}


.camera-status {

  margin-top:
    6px;

  display:
    flex;

  gap:
    5px;

  flex-wrap:
    wrap;

}


.badge {

  display:
    inline-flex;

  align-items:
    center;

  padding:
    3px 7px;

  border-radius:
    999px;

  font-size:
    9px;

  font-weight:
    700;

}


.badge.online {

  background:
    #e8f8ef;

  color:
    #168747;

}


.badge.live {

  background:
    #ffe7e7;

  color:
    #d64444;

}


.badge.maintenance {

  background:
    #eeeeef;

  color:
    #666;

}


/* =====================================================
   VIEWER
===================================================== */

.viewer {

  min-width:
    0;

}


.viewer-header {

  min-height:
    58px;

  padding:
    9px 15px;

  border-radius:
    13px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    12px;

  color:
    #fff;

  background:
    linear-gradient(
      100deg,
      var(--purple-dark),
      var(--purple)
    );

  box-shadow:
    0 6px 18px rgba(74,40,157,.14);

}


.viewer-title {

  font-size:
    17px;

  font-weight:
    800;

}


.viewer-location {

  margin-top:
    1px;

  font-size:
    11px;

  opacity:
    .82;

}


.live-badge {

  flex-shrink:
    0;

  padding:
    4px 9px;

  border-radius:
    999px;

  background:
    #ed5e5e;

  font-size:
    10px;

  font-weight:
    800;

}


/* =====================================================
   VIEWER GRID
===================================================== */

.viewer-grid {

  margin-top:
    10px;

  display:
    grid;

  grid-template-columns:
    minmax(0,1fr) 285px;

  gap:
    10px;

}


/* =====================================================
   VIDEO
===================================================== */

.video-card {

  position:
    relative;

  width:
    100%;

  aspect-ratio:
    4 / 3;

  overflow:
    hidden;

  background:
    #000;

  border-radius:
    13px;

  box-shadow:
    var(--shadow);

}


.video-card video {

  width:
    100%;

  height:
    100%;

  display:
    block;

  object-fit:
    cover;

  background:
    #000;

}


/* =====================================================
   VIDEO LOADING
===================================================== */

.video-loading {

  position:
    absolute;

  inset:
    0;

  z-index:
    3;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  flex-direction:
    column;

  gap:
    9px;

  color:
    #fff;

  background:
    rgba(0,0,0,.32);

  opacity:
    0;

  pointer-events:
    none;

  transition:
    opacity .2s ease;

}


.video-loading.show {

  opacity:
    1;

}


.spinner {

  width:
    31px;

  height:
    31px;

  border:
    3px solid
    rgba(255,255,255,.35);

  border-top-color:
    #fff;

  border-radius:
    50%;

  animation:
    spin .8s linear infinite;

}


@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}


.video-time {

  position:
    absolute;

  left:
    9px;

  top:
    9px;

  padding:
    3px 6px;

  border-radius:
    5px;

  background:
    rgba(0,0,0,.55);

  color:
    #fff;

  font-family:
    monospace;

  font-size:
    10px;

}


/* =====================================================
   WATER PANEL
===================================================== */

.water-panel {

  overflow:
    hidden;

  background:
    #fff;

  border:
    1px solid var(--border);

  border-radius:
    13px;

  box-shadow:
    var(--shadow);

}


.water-header {

  padding:
    10px 13px;

  color:
    #fff;

  background:
    linear-gradient(
      100deg,
      var(--purple-dark),
      var(--purple)
    );

  font-size:
    15px;

  font-weight:
    800;

}


.water-body {

  padding:
    11px;

}


.water-placeholder {

  width:
    100%;

  aspect-ratio:
    1.4;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  flex-direction:
    column;

  text-align:
    center;

  padding:
    12px;

  border-radius:
    9px;

  background:
    linear-gradient(
      135deg,
      #f0edff,
      #faf9ff
    );

  color:
    var(--purple);

}


.water-placeholder-icon {

  font-size:
    42px;

  opacity:
    .55;

}


.water-placeholder strong {

  font-size:
    13px;

}


.water-placeholder span {

  margin-top:
    2px;

  color:
    #888;

  font-size:
    9px;

}


.water-image {

  width:
    100%;

  aspect-ratio:
    1.4;

  object-fit:
    contain;

  border-radius:
    9px;

  background:
    #f7f5ff;

}


.water-value-box {

  margin-top:
    9px;

  padding:
    10px;

  border-radius:
    9px;

  background:
    var(--purple-soft);

}


.water-label {

  font-size:
    10px;

  color:
    var(--muted);

}


.water-value-row {

  display:
    flex;

  align-items:
    baseline;

  gap:
    5px;

}


.water-value {

  font-size:
    27px;

  font-weight:
    800;

  color:
    var(--purple);

}


.water-unit {

  font-size:
    11px;

  color:
    #666;

}


.water-status {

  display:
    inline-flex;

  margin-top:
    5px;

  padding:
    4px 8px;

  border-radius:
    999px;

  font-size:
    10px;

  font-weight:
    700;

}


.water-status.normal {

  background:
    #e8f8ee;

  color:
    #148847;

}


.water-status.warning {

  background:
    #fff5d9;

  color:
    #9b7100;

}


.water-status.critical {

  background:
    #ffe6e6;

  color:
    #c83b3b;

}


.water-status.waiting {

  background:
    #ededf0;

  color:
    #777;

}


/* =====================================================
   WATER META
===================================================== */

.water-meta {

  margin-top:
    7px;

}


.meta-row {

  display:
    flex;

  justify-content:
    space-between;

  gap:
    8px;

  padding:
    6px 0;

  border-bottom:
    1px solid #f0eef5;

  font-size:
    9px;

}


.meta-row:last-child {

  border-bottom:
    0;

}


.meta-label {

  color:
    #999;

}


.meta-value {

  font-weight:
    600;

  text-align:
    right;

}


/* =====================================================
   CAMERA INFO
===================================================== */

.camera-info {

  margin-top:
    10px;

  padding:
    11px;

  background:
    #fff;

  border:
    1px solid var(--border);

  border-radius:
    12px;

  box-shadow:
    var(--shadow);

}


.info-title {

  margin-bottom:
    8px;

  color:
    var(--purple);

  font-size:
    13px;

  font-weight:
    800;

}


.info-grid {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;

}


.logo-info {

  min-width:
    0;

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

}


.logo-info img {

  width:
    45px;

  height:
    45px;

  object-fit:
    contain;

  flex-shrink:
    0;

}


.logo-info-text {

  min-width:
    0;

  font-size:
    9px;

}


.logo-info-text strong {

  display:
    block;

  font-size:
    11px;

}


.logo-info-text span {

  color:
    #777;

}


/* =====================================================
   MAINTENANCE
===================================================== */

.maintenance-page {

  min-height:
    450px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  text-align:
    center;

  padding:
    30px;

  background:
    #fff;

  border:
    1px solid var(--border);

  border-radius:
    15px;

  box-shadow:
    var(--shadow);

}


.maintenance-icon {

  font-size:
    55px;

}


.maintenance-page h2 {

  margin:
    5px 0;

  color:
    var(--purple);

  font-size:
    23px;

}


.maintenance-page p {

  color:
    #777;

  line-height:
    1.7;

  font-size:
    13px;

}


.back-button {

  border:
    0;

  padding:
    8px 15px;

  border-radius:
    9px;

  color:
    #fff;

  background:
    var(--purple);

  font-family:
    inherit;

  cursor:
    pointer;

}


/* =====================================================
   TABLET
===================================================== */

@media (max-width:1200px) {

  .main-layout {

    grid-template-columns:
      260px minmax(0,1fr);

  }


  .viewer-grid {

    grid-template-columns:
      minmax(0,1fr) 250px;

  }


  .header-title {

    font-size:
      15px;

  }

}


/* =====================================================
   SMALL TABLET
===================================================== */

@media (max-width:950px) {

  .header {

    height:
      auto;

    min-height:
      64px;

    padding:
      9px 15px;

  }


  .header-title {

    white-space:
      normal;

  }


  .header-subtitle {

    display:
      block;

    margin:
      2px 0 0;

  }


  .header-subtitle::before {

    display:
      none;

  }


  .main-layout {

    grid-template-columns:
      1fr;

  }


  .camera-panel {

    order:
      2;

  }


  .viewer {

    order:
      1;

  }


  .camera-list {

    display:
      grid;

    grid-template-columns:
      repeat(2,minmax(0,1fr));

  }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:700px) {

  .page {

    width:
      calc(100% - 14px);

    margin:
      8px auto 20px;

  }


  .header {

    padding:
      8px 11px;

  }


  .header-right {

    gap:
      8px;

  }


  .status-online {

    display:
      none;

  }


  .header-title {

    font-size:
      14px;

  }


  .header-subtitle {

    font-size:
      10px;

  }


  .viewer-grid {

    grid-template-columns:
      1fr;

  }


  .water-panel {

    order:
      2;

  }


  .camera-list {

    grid-template-columns:
      1fr;

  }


  .camera-card {

    grid-template-columns:
      125px minmax(0,1fr);

  }


  .info-grid {

    grid-template-columns:
      1fr;

  }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media (max-width:450px) {

  .header {

    align-items:
      flex-start;

  }


  .header-right {

    align-self:
      center;

  }


  .update-box {

    display:
      block;

    text-align:
      right;

  }


  .update-label {

    display:
      none;

  }


  .viewer-title {

    font-size:
      14px;

  }


  .viewer-location {

    font-size:
      9px;

  }


  .camera-card {

    grid-template-columns:
      100px minmax(0,1fr);

  }

}

</style>

</head>

<script>

/* =====================================================
   GLOBAL
===================================================== */

let cameras = [];

let selectedCamera = null;

let hls = null;

let reconnectTimer = null;

let stallTimer = null;

let hlsErrorCount = 0;

let mediaErrorCount = 0;



/* =====================================================
   LOAD CAMERAS
===================================================== */

async function loadCameras() {

  try {

    const response =
      await fetch(
        "/api/cameras",
        {
          cache:
            "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "ไม่สามารถโหลดข้อมูลกล้องได้"
      );

    }


    const data =
      await response.json();


    /*
      รองรับทั้ง

      [
        {...},
        {...}
      ]

      และ

      {
        "CCTV-01": {...},
        "CCTV-02": {...}
      }
    */

    if (
      Array.isArray(data)
    ) {

      cameras = data;

    }

    else {

      cameras =
        Object.values(data);

    }


    renderCameraList();


    const firstEnabled =
      cameras.find(
        camera =>
          camera.enabled
      );


    if (firstEnabled) {

      selectCamera(
        firstEnabled.id
      );

    }

  }

  catch (error) {

    console.error(
      error
    );


    document
      .getElementById(
        "cameraList"
      )
      .innerHTML = `

        <div
          style="
            padding:18px;
            text-align:center;
            color:#777;
            font-size:12px;
          "
        >

          ไม่สามารถโหลดข้อมูลกล้องได้

        </div>

      `;

  }

}



/* =====================================================
   RENDER CAMERA LIST
===================================================== */

function renderCameraList() {

  const container =
    document.getElementById(
      "cameraList"
    );


  container.innerHTML =
    "";


  cameras.forEach(
    camera => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "camera-card" +
        (
          !camera.enabled
            ? " disabled"
            : ""
        );


      if (camera.enabled) {

        card.onclick =
          () =>
            selectCamera(
              camera.id
            );

      }

      else {

        card.onclick =
          () =>
            showMaintenance(
              camera
            );

      }


      /*
      ===============================================
      THUMBNAIL
      ===============================================
      */

      let imageHTML =
        "";


      if (
        camera.thumbnail &&
        camera.thumbnail.trim() !== ""
      ) {

        imageHTML = `

          <img
            src="${camera.thumbnail}"
            alt="${camera.name}"
            loading="eager"

            referrerpolicy="no-referrer"

            onerror="
              this.style.display='none';
              this.parentElement.classList.add('no-image');
            "
          >

        `;

      }


      /*
      ===============================================
      PLACEHOLDER
      ===============================================
      *
      * ใช้เฉพาะกรณีที่กล้องไม่มี thumbnail เท่านั้น
      * ถ้ามี camera.thumbnail จะไม่แสดง placeholder
      */

      const placeholderHTML =
        camera.thumbnail &&
        camera.thumbnail.trim() !== ""
        ? ""
        : `

          <div
            class="camera-placeholder"
          >

            <div
              class="camera-placeholder-icon"
            >
              📹
            </div>

            CCTV

          </div>

        `;


      /*
      ===============================================
      MAINTENANCE
      ===============================================
      */

      const maintenanceHTML =
        !camera.enabled
        ?

        `

          <div
            class="camera-thumb-overlay"
          >

            <div>

              <div
                style="
                  font-size:22px;
                  margin-bottom:3px;
                "
              >
                🔧
              </div>

              กำลังปรับปรุงระบบ

            </div>

          </div>

        `

        :

        "";


      /*
      ===============================================
      CARD
      ===============================================
      */

      card.innerHTML = `

        <div
          class="camera-thumb"
        >

          ${imageHTML}

          ${placeholderHTML}

          ${maintenanceHTML}

        </div>


        <div
          class="camera-content"
        >

          <div
            class="camera-name"
          >

            ${camera.name}

          </div>


          <div
            class="camera-location"
          >

            จุดวัด
            ${camera.location}

          </div>


          <div
            class="camera-id"
          >

            ${camera.id}

          </div>


          <div
            class="camera-status"
          >

            ${
              camera.enabled

              ?

              `

                <span
                  class="badge online"
                >
                  ● ออนไลน์
                </span>

                <span
                  class="badge live"
                >
                  LIVE
                </span>

              `

              :

              `

                <span
                  class="
                    badge
                    maintenance
                  "
                >
                  ● กำลังปรับปรุงระบบ
                </span>

              `
            }

          </div>

        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}



/* =====================================================
   SELECT CAMERA
===================================================== */

function selectCamera(
  cameraId
) {

  const camera =
    cameras.find(
      c =>
        c.id === cameraId
    );


  if (!camera) {

    return;

  }


  selectedCamera =
    camera;


  stopPlayer();


  renderCamera(
    camera
  );


  updateActiveCard(
    camera.id
  );


  setupVideo(
    camera
  );


  updateWaterPanel(
    camera
  );

}



/* =====================================================
   ACTIVE CARD
===================================================== */

function updateActiveCard(
  cameraId
) {

  document
    .querySelectorAll(
      ".camera-card"
    )
    .forEach(
      card =>
        card.classList.remove(
          "active"
        )
    );


  const index =
    cameras.findIndex(
      c =>
        c.id === cameraId
    );


  const cards =
    document.querySelectorAll(
      ".camera-card"
    );


  if (cards[index]) {

    cards[index]
      .classList.add(
        "active"
      );

  }

}



/* =====================================================
   RENDER VIEWER
===================================================== */

function renderCamera(
  camera
) {

  const viewer =
    document.getElementById(
      "viewer"
    );


  viewer.innerHTML = `

    <div
      class="viewer-header"
    >

      <div>

        <div
          class="viewer-title"
        >

          ${camera.name}

        </div>


        <div
          class="viewer-location"
        >

          จุดวัด
          ${camera.location}

          ·

          ${camera.id}

        </div>

      </div>


      <div
        class="live-badge"
      >

        ● LIVE

      </div>

    </div>



    <div
      class="viewer-grid"
    >


      <div>


        <div
          class="video-card"
        >

          <video
            id="cctvVideo"
            controls
            autoplay
            muted
            playsinline
            preload="auto"
          ></video>


          <div
            id="videoLoading"
            class="
              video-loading
              show
            "
          >

            <div
              class="spinner"
            ></div>


            <div>
              กำลังเชื่อมต่อกล้อง...
            </div>

          </div>


          <div
            id="videoTime"
            class="video-time"
          >
            --
          </div>

        </div>



        <div
          class="camera-info"
        >

          <div
            class="info-title"
          >

            📹 ข้อมูลกล้อง

          </div>


          <div
            class="info-grid"
          >


            <div
              class="logo-info"
            >

              ${
                camera.municipalityLogo
                ?

                `
                  <img
                    src="${camera.municipalityLogo}"
                    alt=""
                  >
                `

                :

                ""
              }


              <div
                class="logo-info-text"
              >

                <strong>
                  ${camera.name}
                </strong>

                <span>
                  ${camera.location}
                </span>

              </div>

            </div>



            <div
              class="logo-info"
            >

              ${
                camera.agencyLogo
                ?

                `
                  <img
                    src="${camera.agencyLogo}"
                    alt=""
                  >
                `

                :

                ""
              }


              <div
                class="logo-info-text"
              >

                <strong>
                  หน่วยงานผู้ดูแลระบบ
                </strong>

                <span>
                  ${camera.agencyName || ""}
                </span>

              </div>

            </div>


          </div>

        </div>


      </div>



      <div
        id="waterPanel"
      ></div>


    </div>

  `;

}



/* =====================================================
   STOP PLAYER
===================================================== */

function stopPlayer() {

  clearTimeout(
    reconnectTimer
  );

  clearTimeout(
    stallTimer
  );


  reconnectTimer =
    null;

  stallTimer =
    null;


  if (hls) {

    try {

      hls.stopLoad();

      hls.detachMedia();

      hls.destroy();

    }

    catch (error) {

      console.warn(
        error
      );

    }

    hls =
      null;

  }


  const video =
    document.getElementById(
      "cctvVideo"
    );


  if (video) {

    try {

      video.pause();

      video.removeAttribute(
        "src"
      );

      video.load();

    }

    catch (error) {}

  }

}



/* =====================================================
   SETUP VIDEO
===================================================== */

function setupVideo(
  camera
) {

  const video =
    document.getElementById(
      "cctvVideo"
    );


  if (!video) {

    return;

  }


  hlsErrorCount =
    0;

  mediaErrorCount =
    0;


  let streamUrl =
    camera.stream;


  if (
    camera.id ===
    "CCTV-01"
  ) {

    streamUrl =
      "https://stream.firsttech.co.th/live/nakornnont.stream/index.m3u8?cookieCheck=1";

  }



  /* ===================================================
     HLS.JS
  =================================================== */

  if (
    window.Hls &&
    Hls.isSupported()
  ) {


    hls =
      new Hls({

        debug:
          false,

        enableWorker:
          true,

        lowLatencyMode:
          false,

        backBufferLength:
          30,

        maxBufferLength:
          15,

        maxMaxBufferLength:
          30,

        maxBufferSize:
          30 * 1000 * 1000,

        maxBufferHole:
          .5,

        initialLiveManifestSize:
          3,

        liveSyncMode:
          "edge",

        liveSyncDurationCount:
          4,

        liveMaxLatencyDurationCount:
          12,

        liveSyncOnStallIncrease:
          2,

        nudgeOffset:
          .2,

        nudgeMaxRetry:
          5,

        highBufferWatchdogPeriod:
          2,

        startFragPrefetch:
          true,

        testBandwidth:
          false,

        fragLoadingTimeOut:
          20000,

        fragLoadingMaxRetry:
          4,

        fragLoadingRetryDelay:
          1000,

        fragLoadingMaxRetryTimeout:
          8000

      });


    hls.loadSource(
      streamUrl
    );


    hls.attachMedia(
      video
    );


    hls.on(
      Hls.Events.MANIFEST_PARSED,
      function() {

        hideVideoLoading();

        playVideo(
          video
        );

      }
    );


    hls.on(
      Hls.Events.FRAG_BUFFERED,
      function() {

        hideVideoLoading();

        resetStallWatchdog();

      }
    );


    hls.on(
      Hls.Events.ERROR,
      function(
        event,
        data
      ) {

        console.warn(
          "HLS error:",
          data
        );


        if (
          !data.fatal
        ) {

          return;

        }


        hlsErrorCount++;


        if (
          data.type ===
          Hls.ErrorTypes.NETWORK_ERROR
        ) {

          showVideoLoading(
            "กำลังเชื่อมต่อกล้องใหม่..."
          );


          if (
            hlsErrorCount <= 3
          ) {

            hls.startLoad();

          }

          else {

            reconnectPlayer(
              camera,
              1500
            );

          }


          return;

        }


        if (
          data.type ===
          Hls.ErrorTypes.MEDIA_ERROR
        ) {

          mediaErrorCount++;


          if (
            mediaErrorCount <= 2
          ) {

            hls.recoverMediaError();

          }

          else {

            reconnectPlayer(
              camera,
              1200
            );

          }


          return;

        }


        reconnectPlayer(
          camera,
          2000
        );

      }
    );


    video.addEventListener(
      "playing",
      function() {

        hideVideoLoading();

        resetStallWatchdog();

      }
    );


    video.addEventListener(
      "waiting",
      function() {

        showVideoLoading(
          "กำลังโหลดภาพ..."
        );

        startStallWatchdog(
          camera
        );

      }
    );


    video.addEventListener(
      "stalled",
      function() {

        showVideoLoading(
          "สัญญาณกล้องหยุดชั่วคราว..."
        );

        startStallWatchdog(
          camera
        );

      }
    );


    video.addEventListener(
      "timeupdate",
      function() {

        resetStallWatchdog();

      }
    );

  }


  /* ===================================================
     NATIVE HLS
  =================================================== */

  else if (
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    video.src =
      streamUrl;


    video.addEventListener(
      "loadedmetadata",
      function() {

        playVideo(
          video
        );

      }
    );


    video.addEventListener(
      "playing",
      function() {

        hideVideoLoading();

      }
    );


    video.addEventListener(
      "waiting",
      function() {

        showVideoLoading(
          "กำลังโหลดภาพ..."
        );

      }
    );

  }


  else {

    showVideoLoading(
      "เบราว์เซอร์นี้ไม่รองรับ HLS"
    );

  }

}



/* =====================================================
   PLAY
===================================================== */

function playVideo(
  video
) {

  const promise =
    video.play();


  if (
    promise &&
    typeof promise.catch ===
    "function"
  ) {

    promise.catch(
      error =>
        console.warn(
          "Autoplay:",
          error
        )
    );

  }

}



/* =====================================================
   RECONNECT
===================================================== */

function reconnectPlayer(
  camera,
  delay
) {

  clearTimeout(
    reconnectTimer
  );


  showVideoLoading(
    "กำลังเชื่อมต่อกล้องใหม่..."
  );


  reconnectTimer =
    setTimeout(
      function() {

        if (
          !selectedCamera ||
          selectedCamera.id !==
          camera.id
        ) {

          return;

        }


        setupVideo(
          camera
        );

      },
      delay
    );

}



/* =====================================================
   STALL WATCHDOG
===================================================== */

function startStallWatchdog(
  camera
) {

  clearTimeout(
    stallTimer
  );


  stallTimer =
    setTimeout(
      function() {

        const video =
          document.getElementById(
            "cctvVideo"
          );


        if (!video) {

          return;

        }


        if (
          video.readyState < 3 ||
          video.paused
        ) {

          if (hls) {

            try {

              hls.startLoad();

            }

            catch (error) {}

          }


          setTimeout(
            function() {

              if (
                video.paused ||
                video.readyState < 3
              ) {

                reconnectPlayer(
                  camera,
                  500
                );

              }

            },
            2500
          );

        }

      },
      5000
    );

}



/* =====================================================
   RESET WATCHDOG
===================================================== */

function resetStallWatchdog() {

  clearTimeout(
    stallTimer
  );

}



/* =====================================================
   LOADING
===================================================== */

function showVideoLoading(
  text
) {

  const loading =
    document.getElementById(
      "videoLoading"
    );


  if (!loading) {

    return;

  }


  loading.classList.add(
    "show"
  );


  const label =
    loading.querySelector(
      "div:last-child"
    );


  if (label) {

    label.textContent =
      text;

  }

}


function hideVideoLoading() {

  const loading =
    document.getElementById(
      "videoLoading"
    );


  if (loading) {

    loading.classList.remove(
      "show"
    );

  }

}



/* =====================================================
   WATER PANEL
===================================================== */

function updateWaterPanel(
  camera
) {

  const panel =
    document.getElementById(
      "waterPanel"
    );


  if (!panel) {

    return;

  }


  const water =
    camera.water ||
    {};


  const value =
    water.value === null ||
    water.value === undefined ||
    water.value === ""
      ? "--"
      : Number(
          water.value
        ).toFixed(2);


  const status =
    water.status ||
    "waiting";


  const statusText =
    water.statusText ||
    "รอข้อมูล";


  let imageHTML;


  if (
    camera.waterStatusImage
  ) {

    imageHTML = `

      <img
        class="water-image"
        src="${camera.waterStatusImage}"
        alt="ข้อมูลระดับน้ำ"
      >

    `;

  }

  else {

    imageHTML = `

      <div
        class="water-placeholder"
      >

        <div
          class="water-placeholder-icon"
        >
          🌊
        </div>


        <strong>
          พื้นที่สำหรับข้อมูลระดับน้ำ
        </strong>


        <span>
          สามารถเพิ่มรูปสถานะระดับน้ำได้
        </span>

      </div>

    `;

  }


  panel.innerHTML = `

    <div
      class="water-panel"
    >

      <div
        class="water-header"
      >

        💧 ข้อมูลระดับน้ำ

      </div>


      <div
        class="water-body"
      >

        ${imageHTML}


        <div
          class="water-value-box"
        >

          <div
            class="water-label"
          >

            ระดับน้ำปัจจุบัน

          </div>


          <div
            class="water-value-row"
          >

            <span
              class="water-value"
            >

              ${value}

            </span>


            <span
              class="water-unit"
            >

              ${water.unit || "ซม."}

            </span>

          </div>


          <div
            class="
              water-status
              ${status}
            "
          >

            ●
            ${statusText}

          </div>

        </div>


        <div
          class="water-meta"
        >

          <div
            class="meta-row"
          >

            <span
              class="meta-label"
            >
              รหัสกล้อง
            </span>

            <span
              class="meta-value"
            >
              ${camera.id}
            </span>

          </div>


          <div
            class="meta-row"
          >

            <span
              class="meta-label"
            >
              จุดติดตั้ง
            </span>

            <span
              class="meta-value"
            >
              ${camera.location}
            </span>

          </div>


          <div
            class="meta-row"
          >

            <span
              class="meta-label"
            >
              อัปเดตข้อมูลน้ำ
            </span>

            <span
              class="meta-value"
            >

              ${
                water.updatedAt
                  ? formatDate(
                      water.updatedAt
                    )
                  : "--"
              }

            </span>

          </div>

        </div>

      </div>

    </div>

  `;

}



/* =====================================================
   MAINTENANCE
===================================================== */

function showMaintenance(
  camera
) {

  stopPlayer();


  const viewer =
    document.getElementById(
      "viewer"
    );


  viewer.innerHTML = `

    <div
      class="maintenance-page"
    >

      <div>

        <div
          class="maintenance-icon"
        >
          🔧
        </div>


        <h2>
          ${camera.name}
        </h2>


        <p>

          จุดวัด
          ${camera.location}

          <br>

          ระบบอยู่ระหว่างการปรับปรุง

        </p>


        <button
          class="back-button"
          onclick="backToCamera()"
        >

          ← กลับไปเลือกกล้อง

        </button>

      </div>

    </div>

  `;

}



/* =====================================================
   BACK
===================================================== */

function backToCamera() {

  const camera =
    cameras.find(
      c =>
        c.enabled
    );


  if (camera) {

    selectCamera(
      camera.id
    );

  }

}



/* =====================================================
   DATE
===================================================== */

function formatDate(
  value
) {

  if (!value) {

    return "--";

  }


  const date =
    new Date(value);


  if (
    isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  return date.toLocaleString(
    "th-TH",
    {
      dateStyle:
        "short",

      timeStyle:
        "short"
    }
  );

}



/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

  const now =
    new Date();


  const header =
    document.getElementById(
      "headerUpdate"
    );


  if (header) {

    header.textContent =
      now.toLocaleString(
        "th-TH",
        {
          dateStyle:
            "short",

          timeStyle:
            "short"
        }
      );

  }


  const videoTime =
    document.getElementById(
      "videoTime"
    );


  if (videoTime) {

    videoTime.textContent =
      now.toLocaleTimeString(
        "th-TH"
      );

  }

}


setInterval(
  updateClock,
  1000
);

updateClock();



/* =====================================================
   SPLASH
===================================================== */

window.addEventListener(
  "load",
  function() {

    setTimeout(
      function() {

        const splash =
          document.getElementById(
            "splash"
          );


        if (splash) {

          splash.classList.add(
            "hide"
          );

        }

      },
      900
    );

  }
);



/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {
a
    stopPlayer();

  }
);



/* =====================================================
   START
===================================================== */

loadCameras();

</script>
