<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ดูภาพสดและระดับน้ำริมแม่น้ำเจ้าพระยา จังหวัดนนทบุรี">
<title>NontWater · ระดับน้ำนนทบุรี</title>
<link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/1/15/Seal_Nonthaburi.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js" defer></script>
<style>
:root{
  --purple:#5b35b5;--purple-dark:#45218f;--purple-soft:#f4f0ff;
  --text:#29263b;--muted:#6f6b80;--border:#e6e1f2;--bg:#f7f6fb;--card:#fff;
  --normal:#14934a;--warning:#c98f00;--critical:#d63a3a;--none:#8b88a0;
  --radius:14px;--shadow:0 6px 22px rgba(55,40,100,.07);
}
*{box-sizing:border-box}
html,body{margin:0;font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--text);background:var(--bg);line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #9c7df0;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
  min-height:64px;padding:8px 20px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:40px;height:40px;object-fit:contain}
.brand b{display:block;font-size:clamp(15px,2.2vw,19px);font-weight:800;line-height:1.25}
.brand small{display:block;color:var(--muted);font-size:12px}
.head-right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;background:var(--purple-soft);color:var(--purple-dark);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--none)}
.pill.ok .dot{background:var(--normal);box-shadow:0 0 0 0 rgba(20,147,74,.5);animation:pulse 2s infinite}
.pill.bad{background:#fdecec;color:#a42626}.pill.bad .dot{background:var(--critical)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(20,147,74,0)}100%{box-shadow:0 0 0 0 rgba(20,147,74,0)}}

/* layout */
.page{max-width:1280px;margin:0 auto;padding:20px}
.layout{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
.panel-title{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--muted)}

/* camera list */
.cams{display:flex;flex-direction:column;gap:12px}
.cam{display:block;width:100%;padding:0;text-align:left;cursor:pointer;background:var(--card);border:2px solid var(--border);
  border-radius:var(--radius);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.cam:hover{border-color:#cfc4ee}
.cam[aria-current="true"]{border-color:var(--purple);box-shadow:var(--shadow)}
.cam img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#ddd9ea}
.cam-body{padding:10px 12px 12px}
.cam-name{font-weight:700;font-size:14px;line-height:1.35}
.cam-loc{color:var(--muted);font-size:12px;margin-top:2px}
.cam-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px}
.lvl{font-weight:700}
.lvl.normal{color:var(--normal)}.lvl.warning{color:var(--warning)}.lvl.critical{color:var(--critical)}

/* viewer */
.viewer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.viewer-head h1{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:800;line-height:1.3}
.viewer-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.video{position:relative;background:#14111f;border-radius:var(--radius);overflow:hidden;aspect-ratio:16/9}
.video video,.video img.snap{width:100%;height:100%;object-fit:contain;display:block}
.video .stamp{position:absolute;right:10px;top:10px;padding:3px 9px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-variant-numeric:tabular-nums}
.video .live{position:absolute;left:10px;top:10px;padding:3px 9px;border-radius:6px;background:var(--critical);color:#fff;font-size:12px;font-weight:700}
.video .live.off{background:#5a5670}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:rgba(20,17,31,.72);color:#fff;font-size:14px;text-align:center;padding:16px}
.overlay.show{display:flex}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay button{padding:7px 16px;border:0;border-radius:8px;background:#fff;color:var(--purple-dark);font-weight:700;cursor:pointer}
.info{margin-top:16px;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.org{display:flex;align-items:center;gap:12px;min-width:0}
.org img{width:44px;height:44px;object-fit:contain;flex-shrink:0}
.org b{display:block;font-size:13px}.org span{display:block;color:var(--muted);font-size:12px}

/* water gauge: จุดเด่นของหน้า */
.water{padding:18px}
.water h2{margin:0 0 14px;font-size:15px;font-weight:700}
.gauge-wrap{display:flex;gap:18px;align-items:stretch}
.staff{position:relative;width:62px;height:230px;flex-shrink:0;border-radius:8px;background:linear-gradient(#e9e4f7,#cfc4ee);border:1px solid var(--border);overflow:hidden}
.staff .fill{position:absolute;left:0;right:0;bottom:0;background:var(--c,var(--none));opacity:.85;transition:height .8s cubic-bezier(.3,.8,.3,1)}
.staff .tick{position:absolute;right:0;width:14px;height:2px;background:rgba(41,38,59,.45)}
.staff .tick.mid{width:22px}
.staff .tick i{position:absolute;right:26px;top:-9px;font:600 10px "Noto Sans Thai",sans-serif;font-style:normal;color:#4d4863}
.reading{display:flex;flex-direction:column;justify-content:center;min-width:0}
.reading small{color:var(--muted);font-size:12px}
.num{font-size:clamp(40px,6vw,52px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.num span{font-size:16px;font-weight:600;color:var(--muted);margin-left:5px}
.flag{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;background:var(--c,var(--none));width:fit-content}
.flag::before{content:"";width:10px;height:12px;background:#fff;clip-path:polygon(0 0,100% 25%,0 50%,0 100%,0 100%)}
.meta{margin-top:16px;border-top:1px solid var(--border);padding-top:12px;font-size:13px}
.meta div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.meta dt{color:var(--muted)}.meta dd{margin:0;font-weight:600;text-align:right}
.stale{margin-top:10px;padding:8px 10px;border-radius:8px;background:#fff6dd;color:#7a5600;font-size:12px}
.water-img{display:block;width:100%;margin-top:14px;border-radius:10px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* splash */
.splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fff;transition:opacity .35s,visibility .35s}
.splash.hide{opacity:0;visibility:hidden}
.splash img{width:84px}.splash b{font-size:20px;font-weight:800;text-align:center;padding:0 20px}

@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .cams{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
  .cam{flex:0 0 240px;scroll-snap-align:start}
  .grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .page{padding:12px}.header{padding:8px 12px}
  .head-right .clock{display:none}
  .info{grid-template-columns:1fr}
  .staff{height:200px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash" class="splash" role="status">
  <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/Seal_Nonthaburi.png" alt="">
  <b>ระบบกล้องวงจรปิดตรวจวัดระดับน้ำ จังหวัดนนทบุรี</b>
</div>

<header class="header">
  <div class="brand">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/Seal_Nonthaburi.png" alt="ตราจังหวัดนนทบุรี">
    <div><b>ระบบตรวจวัดระดับน้ำ จังหวัดนนทบุรี</b><small>CCTV Water Monitoring System</small></div>
  </div>
  <div class="head-right">
    <span class="clock" id="clock">--</span>
    <span id="sys" class="pill"><span class="dot"></span><span id="sysText">กำลังตรวจสอบ</span></span>
  </div>
</header>

<main class="page">
  <div class="layout">
    <aside>
      <h2 class="panel-title">เลือกจุดตรวจวัด</h2>
      <div id="cams" class="cams"><div class="empty">กำลังโหลด...</div></div>
    </aside>
    <section id="viewer" aria-live="polite"></section>
  </div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^(https?:)?\/\//.test(u || "") || String(u || "").startsWith("/") ? esc(u) : "";
const STALE_HOURS = 6, REFRESH_MS = 60000, SNAP_MS = 10000;
const fmt = d => { const t = new Date(d); return isNaN(t) ? "--" : t.toLocaleString("th-TH", {dateStyle:"medium", timeStyle:"short"}); };

let cameras = [], current = null, hls = null, retry = 0, retryTimer = null, snapTimer = null;

/* ---------- data ---------- */
async function loadCameras(first) {
  try {
    const r = await fetch("/api/cameras", {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    cameras = await r.json();
    setSystem(true);
    renderList();
    if (first) {
      const wanted = cameras.find(c => c.id === location.hash.slice(1) && c.enabled) || cameras.find(c => c.enabled);
      wanted ? select(wanted.id) : $("viewer").innerHTML = '<div class="card empty">ขณะนี้ยังไม่มีจุดตรวจวัดที่เปิดใช้งาน</div>';
    } else if (current) {
      current = cameras.find(c => c.id === current.id) || current;
      renderWater(current);               // อัปเดตระดับน้ำโดยไม่รีโหลดวิดีโอ
    }
  } catch (e) {
    setSystem(false);
    if (first) $("cams").innerHTML = '<div class="card empty">โหลดข้อมูลกล้องไม่ได้ กรุณาลองใหม่อีกครั้ง<br><br><button onclick="location.reload()">โหลดใหม่</button></div>';
  }
}
function setSystem(ok) {
  $("sys").className = "pill " + (ok ? "ok" : "bad");
  $("sysText").textContent = ok ? "ระบบออนไลน์" : "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้";
}

/* ---------- list ---------- */
function renderList() {
  $("cams").innerHTML = cameras.map(c => {
    const w = c.water || {};
    const lvl = w.value == null ? "" : `<span class="lvl ${esc(w.status)}">${Number(w.value).toFixed(1)} ${esc(w.unit || "ซม.")}</span>`;
    return `<button class="cam" data-id="${esc(c.id)}" ${c.enabled ? "" : "disabled"} aria-current="${current && current.id === c.id}">
      <img src="${safeUrl(c.thumbnail)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="cam-body">
        <div class="cam-name">${esc(c.name)}</div>
        <div class="cam-loc">จุดวัด ${esc(c.location)}</div>
        <div class="cam-row"><span>${c.enabled ? "เปิดใช้งาน" : "กำลังปรับปรุง"}</span>${lvl}</div>
      </div></button>`;
  }).join("");
  document.querySelectorAll(".cam").forEach(b => b.onclick = () => select(b.dataset.id));
}

/* ---------- viewer ---------- */
function select(id) {
  const c = cameras.find(x => x.id === id);
  if (!c || !c.enabled) return;
  current = c;
  history.replaceState(null, "", "#" + id);
  document.title = c.name + " · NontWater";
  renderList();
  $("viewer").innerHTML = `
    <div class="viewer-head"><div><h1>${esc(c.name)}</h1><p>จุดวัด ${esc(c.location)} · ${esc(c.id)}</p></div></div>
    <div class="grid">
      <div>
        <div class="video">
          <video id="vid" controls autoplay muted playsinline></video>
          <img id="snap" class="snap" alt="ภาพนิ่งล่าสุดจากกล้อง" hidden>
          <span id="live" class="live off">กำลังเชื่อมต่อ</span>
          <div id="ov" class="overlay show"><div class="spinner"></div><div id="ovText">กำลังเชื่อมต่อกล้อง...</div></div>
        </div>
        <div class="card info">
          <div class="org">${c.municipalityLogo ? `<img src="${safeUrl(c.municipalityLogo)}" alt="" onerror="this.remove()">` : ""}<div><b>${esc(c.name)}</b><span>${esc(c.location)}</span></div></div>
          <div class="org">${c.agencyLogo ? `<img src="${safeUrl(c.agencyLogo)}" alt="" onerror="this.remove()">` : ""}<div><b>หน่วยงานผู้ดูแลระบบ</b><span>${esc(c.agencyName)}</span></div></div>
        </div>
      </div>
      <div id="water" class="card water"></div>
    </div>`;
  renderWater(c);
  startPlayer(c);
}

function renderWater(c) {
  const el = $("water"); if (!el) return;
  const w = c.water || {}, has = w.value != null;
  const st = has ? w.status : "none";
  const pct = has ? Math.max(0, Math.min(100, Number(w.value))) : 0;
  const ageH = w.updatedAt ? (Date.now() - new Date(w.updatedAt)) / 36e5 : null;
  const ticks = [0,25,50,75,100].map(v => `<div class="tick mid" style="bottom:${v}%"><i>${v}</i></div>`).join("")
              + [12.5,37.5,62.5,87.5].map(v => `<div class="tick" style="bottom:${v}%"></div>`).join("");
  el.style.setProperty("--c", `var(--${st === "none" ? "none" : esc(st)})`);
  el.innerHTML = `
    <h2>ระดับน้ำปัจจุบัน</h2>
    <div class="gauge-wrap">
      <div class="staff" role="img" aria-label="ระดับน้ำ ${has ? pct + " เซนติเมตร" : "ไม่มีข้อมูล"}"><div class="fill" style="height:${pct}%"></div>${ticks}</div>
      <div class="reading">
        <small>ซม. จากเกณฑ์วัด</small>
        <div class="num">${has ? Number(w.value).toFixed(1) : "--"}<span>${esc(w.unit || "ซม.")}</span></div>
        <div class="flag">${esc(w.statusText || "ไม่มีข้อมูล")}</div>
      </div>
    </div>
    ${ageH !== null && ageH > STALE_HOURS ? `<div class="stale">ข้อมูลระดับน้ำไม่ได้อัปเดตมาแล้ว ${Math.floor(ageH)} ชั่วโมง ควรตรวจสอบกับเจ้าหน้าที่</div>` : ""}
    <dl class="meta">
      <div><dt>รหัสกล้อง</dt><dd>${esc(c.id)}</dd></div>
      <div><dt>จุดติดตั้ง</dt><dd>${esc(c.location)}</dd></div>
      <div><dt>บันทึกข้อมูลเมื่อ</dt><dd>${w.updatedAt ? fmt(w.updatedAt) : "--"}</dd></div>
    </dl>
    ${c.waterStatusImage ? `<img class="water-img" src="${safeUrl(c.waterStatusImage)}" alt="แผนภาพสถานะระดับน้ำ" loading="lazy" onerror="this.remove()">` : ""}`;
}

/* ---------- player ---------- */
function overlay(show, text, withRetry) {
  const ov = $("ov"); if (!ov) return;
  ov.classList.toggle("show", show);
  if (text) $("ovText").innerHTML = esc(text) + (withRetry ? '<br><button id="retryBtn">ลองใหม่</button>' : "");
  if (withRetry) $("retryBtn").onclick = () => { retry = 0; startPlayer(current); };
  ov.querySelector(".spinner").style.display = withRetry ? "none" : "";
}
function liveBadge(on, text) { const l = $("live"); if (l) { l.textContent = text; l.classList.toggle("off", !on); } }

function stopPlayer() {
  clearTimeout(retryTimer); clearInterval(snapTimer);
  if (hls) { hls.destroy(); hls = null; }
  const v = $("vid"); if (v) { v.pause(); v.removeAttribute("src"); v.load(); }
}

function startPlayer(c) {
  stopPlayer();
  const v = $("vid"); if (!v) return;
  $("snap").hidden = true; v.hidden = false;
  v.onplaying = () => { retry = 0; overlay(false); liveBadge(true, "● LIVE"); };
  v.onwaiting = () => overlay(true, "กำลังโหลดภาพ...");
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({lowLatencyMode:false, backBufferLength:30, maxBufferLength:15, liveSyncDurationCount:4, liveMaxLatencyDurationCount:12});
    hls.loadSource(c.stream); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR && retry++ < 2) return hls.recoverMediaError();
      reconnect(c);
    });
  } else if (v.canPlayType("application/vnd.apple.mpegurl")) {
    v.src = c.stream; v.onerror = () => reconnect(c); v.play().catch(() => {});
  } else if (!window.Hls && retry++ < 5) {      // hls.js ยังโหลดไม่เสร็จ (defer)
    retryTimer = setTimeout(() => startPlayer(c), 600);
  } else { snapshotMode(c); }
}

function reconnect(c) {
  retry++;
  if (retry > 4) return snapshotMode(c);        // สตรีมใช้ไม่ได้ → สลับเป็นภาพนิ่งที่ server ดึงให้
  overlay(true, "สัญญาณหลุด กำลังเชื่อมต่อใหม่...");
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => current && current.id === c.id && startPlayer(c), Math.min(1500 * 2 ** retry, 12000));
}

function snapshotMode(c) {
  if (hls) { hls.destroy(); hls = null; }
  const v = $("vid"), s = $("snap"); if (!v || !s) return;
  v.hidden = true; s.hidden = false;
  liveBadge(false, "ภาพนิ่ง");
  const load = () => {
    const img = new Image();
    img.onload = () => { s.src = img.src; overlay(false); };
    img.onerror = () => overlay(true, "ไม่สามารถดึงภาพจากกล้องได้ในขณะนี้", true);
    img.src = `/api/snapshot/${encodeURIComponent(c.id)}?t=${Date.now()}`;
  };
  load(); snapTimer = setInterval(load, SNAP_MS);
}

/* ---------- misc ---------- */
setInterval(() => {
  const n = new Date();
  $("clock").textContent = n.toLocaleString("th-TH", {dateStyle:"medium", timeStyle:"medium"});
}, 1000);

document.addEventListener("visibilitychange", () => {   // ประหยัดเน็ต: หยุดเมื่อสลับแท็บ
  if (!current) return;
  if (document.hidden) stopPlayer(); else { loadCameras(false); startPlayer(current); }
});
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && (!current || id !== current.id)) select(id); });
setInterval(() => !document.hidden && loadCameras(false), REFRESH_MS);

loadCameras(true).finally(() => setTimeout(() => $("splash").classList.add("hide"), 250));
</script>
</body>
</html>
